name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (26.5 = xnu-12377.121.6, iOS 26 era)
        default: "26.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main, master, upgrade_ios_version_target]
    paths:
      - "xnu/patches-26/**"
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: bd88697145b2d8008bbed951fef99795308262f0
  MACOS_VERSION: ${{ inputs.macos_version || '26.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("dxb/build.sh")
          s = p.read_text()

          # 1. Honor preset KDKROOT (fake-kdk) instead of downloading the 1.2 GB KDK DMG
          s, n_kdk = re.subn(
              r"KDKROOT='(/Library/Developer/KDKs/[^']+)'",
              r'KDKROOT="${KDKROOT:-\1}"',
              s,
          )
          assert n_kdk > 0, "Failed to patch KDKROOT in dxb/build.sh"

          # 2. libfirehose_kernel is built arm64e-only upstream; SWEET kernel is plain arm64
          old_arch = 'ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"'
          new_arch = 'ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"'
          assert old_arch in s, "Failed to find libfirehose_kernel ARCHS in dxb/build.sh"
          s = s.replace(old_arch, new_arch, 1)

          # 3. Keep dxb's own conditional check loop for dxb/patches/26.0 (which has commented-out/26.0-only
          #    patches), then stage & apply all xnu/patches-26 scripts and patches fail-fast
          old_patches = (
              '        for PATCH in "${PATCH_DIR}"/*.patch; do\n'
              '            if git apply --check "$PATCH" 2> /dev/null; then\n'
              '                running "Applying patch: ${PATCH}"\n'
              '                git apply "$PATCH"\n'
              '            fi\n'
              '        done'
          )
          new_patches = (
              old_patches + '\n'
              '        SWEET_PATCH_DIR="${GITHUB_WORKSPACE}/xnu/patches-26"\n'
              '        for SCRIPT in "${SWEET_PATCH_DIR}"/*.sh; do\n'
              '            running "Running sweet stage script: ${SCRIPT}"\n'
              '            bash "${SCRIPT}"\n'
              '        done\n'
              '        for PATCH in "${SWEET_PATCH_DIR}"/*.patch; do\n'
              '            running "Applying sweet patch: ${PATCH}"\n'
              '            git apply --verbose "$PATCH"\n'
              '        done'
          )
          assert old_patches in s, "Failed to find patch loop in dxb/build.sh"
          s = s.replace(old_patches, new_patches, 1)

          p.write_text(s)
          PY
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches/26.0 xnu/patches-26

      - name: Deps
        run: |
          for pkg in jq gum bash cmake ninja; do
            command -v "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done
          # build.sh checks command -v xcodes; only install stub if xcodes is not already preinstalled
          if ! command -v xcodes >/dev/null 2>&1; then
            printf '#!/bin/sh\nexit 0\n' | sudo tee "$(brew --prefix)/bin/xcodes" >/dev/null
            sudo chmod +x "$(brew --prefix)/bin/xcodes"
          fi
          # SWEET links no closed KDK archives (tools/build-xnu.sh); populate fake-kdk with CoreEntitlements V2 headers
          mkdir -p "$PWD/fake-kdk"
          KDKROOT="$PWD/fake-kdk" bash xnu/patches-26/0000-stage-coreentitlements-v2.sh
          echo "KDKROOT=$PWD/fake-kdk" >> "$GITHUB_ENV"
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XC" ]; then
            XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          fi
          [ -n "$XC" ] || XC=/Applications/Xcode.app
          sudo xcode-select -s "$XC"
          DEV_DIR="$XC/Contents/Developer"
          echo "DEVELOPER_DIR=$DEV_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Package build tree for local compiles
        if: failure()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: failure()
        run: |
          mkdir -p out-debug/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            [ -f "$lib" ] || continue
            b=$(basename "$lib" .a)
            ar t "$lib" > "out-debug/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out-debug/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out-debug/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out-debug/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out out-debug
          for f in dxb/fakeroot/System/Library/Kernels/kernel.development.* \
                   dxb/fakeroot/System/Library/Kernels/kernel.release.* \
                   dxb/fakeroot/System/Library/Kernels/kernel.debug.*; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            case "$b" in
              *.dSYM|*.link|*.unstripped)
                cp -R "$f" "out-debug/$b"
                ;;
              *)
                [ -f "$f" ] && cp "$f" "out/$b"
                ;;
            esac
          done
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) 2>/dev/null || true
          ls -la out out-debug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-debug
          path: out-debug/
          retention-days: 3
          if-no-files-found: ignore
